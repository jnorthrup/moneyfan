<!DOCTYPE html>
<html lang=\"en\">
<head>
    <meta charset=\"UTF-8\">
    <title>Fusion Trader - Advanced Crypto Options Arena</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #000;
            padding: .5rem 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #0af;
        }
        #arena {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
            overflow-y: auto;
        }
        .bot {
            width: 280px;
            height: 220px;
            border: 2px solid #0af;
            border-radius: 8px;
            background: #222;
            display: flex;
            flex-direction: column;
            padding: .5rem;
            margin: 0.5rem;
        }
        .bot h3 {
            margin: 0 0 .3rem 0;
            font-size: 1rem;
            color: #0af;
        }
        .log {
            flex: 1;
            background: #000;
            border-radius: 4px;
            padding: .3rem;
            font-size: .7rem;
            overflow-y: auto;
            white-space: pre-line;
        }
        #controls {
            background: #000;
            padding: .5rem 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            border-top: 2px solid #0af;
        }
        button {
            background: #0af;
            border: none;
            color: #000;
            padding: .4rem .8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #08c;
        }
        label {
            font-size: .8rem;
        }
        input[type=range] {
            width: 120px;
        }
        #market-info {
            display: flex;
            justify-content: space-around;
            background: #000;
            padding: 0.5rem;
            border-top: 1px solid #555;
        }
        .market-data {
            text-align: center;
            margin: 0 1rem;
        }
        .market-data span {
            display: block;
            font-size: 0.9rem;
        }
        .market-data .value {
            font-weight: bold;
            color: #0af;
        }
        .pnl-positive { color: #0f0; }
        .pnl-negative { color: #f55; }
    </style>
</head>
<body>
    <header>Fusion Trader - Advanced Crypto Options Arena (Black-Scholes + Dynamic Hedging + Alpha Sniping)</header>
    
    <div id=\"market-info\">
        <div class=\"market-data\">
            <span>Current Price</span>
            <span id=\"current-price\" class=\"value\">50000.00</span>
        </div>
        <div class=\"market-data\">
            <span>Volatility</span>
            <span id=\"current-vol\" class=\"value\">45.0%</span>
        </div>
        <div class=\"market-data\">
            <span>Time to Exp</span>
            <span id=\"time-exp\" class=\"value\">7.00 days</span>
        </div>
        <div class=\"market-data\">
            <span>Total PnL</span>
            <span id=\"total-pnl\" class=\"value\">0.00</span>
        </div>
    </div>
    
    <div id=\"arena\"></div>
    
    <div id=\"controls\">
        <button id=\"startBtn\">Start Battle</button>
        <button id=\"resetBtn\">Reset</button>
        <label>Speed <input type=\"range\" id=\"speed\" min=\"100\" max=\"2000\" value=\"500\"></label>
        <button id=\"addBotBtn\">Add Custom Bot</button>
    </div>

    <script>
        /******************************************************************************************
         * 1.  Market & Contract Specs
         ******************************************************************************************/
        const INITIAL_PRICE = 50000;        // BTC-USD
        const VOLATILITY    = 0.45;         // 45 % annual
        const RISK_FREE     = 0.03;         // 3 % annual
        const STRIKE        = INITIAL_PRICE;
        const DAYS_TO_EXP   = 7;
        const SECONDS_PER_DAY = 24*60*60;

        /******************************************************************************************
         * 2.  Tiny Utils
         ******************************************************************************************/
        const randn = () => { 
            let u=0,v=0; 
            while(u===0)u=Math.random(); 
            while(v===0)v=Math.random(); 
            return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); 
        };
        
        const erf = (x) => {
            // approximation of error function
            const a1 =  0.254829592;
            const a2 = -0.284496736;
            const a3 =  1.421413741;
            const a4 = -1.453152027;
            const a5 =  1.061405429;
            const p  =  0.3275911;

            const sign = x >= 0 ? 1 : -1;
            const xAbs = Math.abs(x);
            
            const t = 1.0 / (1.0 + p * xAbs);
            const y = 1.0 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-xAbs * xAbs);
            
            return sign * y;
        };

        const blackScholes = (S,K,T,sigma,r,call=true) => {
            const d1 = (Math.log(S/K) + (r + 0.5*sigma*sigma)*T) / (sigma*Math.sqrt(T));
            const d2 = d1 - sigma*Math.sqrt(T);
            const nd = x => 0.5*(1+erf(x/Math.sqrt(2)));
            if (call) return S*nd(d1) - K*Math.exp(-r*T)*nd(d2);
            else      return K*Math.exp(-r*T)*nd(-d2) - S*nd(-d1);
        };
        
        const delta = (S,K,T,sigma,r,call=true) => {
            const d1 = (Math.log(S/K) + (r + 0.5*sigma*sigma)*T) / (sigma*Math.sqrt(T));
            const nd = x => 0.5*(1+erf(x/Math.sqrt(2)));
            return call ? nd(d1) : nd(d1)-1;
        };

        /******************************************************************************************
         * 3.  Bot Base Class
         ******************************************************************************************/
        class Bot {
            constructor(name, color, cash=1e6) {
                this.name = name;
                this.color = color;
                this.cash = cash;
                this.shares = 0;
                this.options = 0;          // net position (+=long,-=short)
                this.premium = 0;          // total premium paid/received
                this.log = [];
                this.arenaDiv = null;
                this.initialCash = cash;
            }
            
            logMsg(msg) { 
                this.log.push(msg); 
                if(this.log.length>12)this.log.shift(); 
                this.render(); 
            }
            
            render() {
                if (!this.arenaDiv) return;
                
                const pnl = (this.cash + this.shares*market.price + 
                            (this.options > 0 ? 
                                this.options * Math.max(market.price-STRIKE, 0) : 
                                this.options * Math.min(market.price-STRIKE, 0)) - this.initialCash);
                
                const pnlClass = pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                
                this.arenaDiv.innerHTML = `
                    <h3 style=\"color:${this.color}\">${this.name}</h3>
                    <div class=\"log\">Cash: ${this.cash.toFixed(0)} USD
                        Shares: ${this.shares.toFixed(2)}
                        Options: ${this.options.toFixed(2)}
                        PnL: <span class=\"${pnlClass}\">${pnl.toFixed(0)}</span>
                        ${this.log.join('\\n')}</div>`;
            }
            
            value() { 
                return this.cash + this.shares*market.price + 
                      (this.options > 0 ? 
                          this.options * Math.max(market.price-STRIKE, 0) : 
                          this.options * Math.min(market.price-STRIKE, 0)); 
            }
        }

        /******************************************************************************************
         * 4.  Concrete Strategies
         ******************************************************************************************/
        class DeltaHedger extends Bot {
            think() {
                const T = Math.max(market.T, 1/secondsPerYear);
                const d = delta(market.price, STRIKE, T, VOLATILITY, RISK_FREE, true);
                const targetShares = -this.options * d;
                const deltaShares = targetShares - this.shares;
                if (Math.abs(deltaShares) < 0.01) return;
                if (deltaShares > 0) { // buy
                    const qty = deltaShares;
                    const cost = qty * market.price;
                    if (cost <= this.cash) {
                        this.cash -= cost; this.shares += qty;
                        this.logMsg(`HEDGE BUY ${qty.toFixed(2)} @ ${market.price.toFixed(0)}`);
                    }
                } else { // sell
                    const qty = -deltaShares;
                    this.cash += qty * market.price; this.shares -= qty;
                    this.logMsg(`HEDGE SELL ${qty.toFixed(2)} @ ${market.price.toFixed(0)}`);
                }
            }
        }
        
        class VolArb extends Bot {
            constructor(name, color) { 
                super(name, color); 
                this.targetVol = VOLATILITY; 
            }
            think() {
                const realized = market.volatility(); // 24h realized
                const T = Math.max(market.T, 1/secondsPerYear);
                const optPrice = blackScholes(market.price, STRIKE, T, this.targetVol, RISK_FREE, true);
                const fairPrice = blackScholes(market.price, STRIKE, T, realized, RISK_FREE, true);
                if (optPrice < fairPrice*0.97) { // buy cheap
                    const qty = 10;
                    if (this.cash > qty*optPrice) {
                        this.options += qty; this.cash -= qty*optPrice; this.premium += qty*optPrice;
                        this.logMsg(`VOL BUY 10 @ ${optPrice.toFixed(0)} (realVol ${(realized*100).toFixed(1)}%)`);
                    }
                } else if (optPrice > fairPrice*1.03) { // sell rich
                    const qty = 10;
                    this.options -= qty; this.cash += qty*optPrice; this.premium -= qty*optPrice;
                    this.logMsg(`VOL SELL 10 @ ${optPrice.toFixed(0)} (realVol ${(realized*100).toFixed(1)}%)`);
                }
            }
        }
        
        class Momentum extends Bot {
            think() {
                const ret = (market.price - market.history[Math.max(0,market.history.length-20)]) / market.history[Math.max(0,market.history.length-20)];
                if (ret > 0.02 && this.cash > 5000) {
                    const qty = 1;
                    const optPrice = blackScholes(market.price, STRIKE, Math.max(market.T,1/secondsPerYear), VOLATILITY, RISK_FREE, true);
                    this.options += qty; this.cash -= optPrice;
                    this.logMsg(`MOMO CALL ${qty} @ ${optPrice.toFixed(0)}`);
                }
                if (ret < -0.02 && this.options > 1) {
                    const qty = 1;
                    const optPrice = blackScholes(market.price, STRIKE, Math.max(market.T,1/secondsPerYear), VOLATILITY, RISK_FREE, true);
                    this.options -= qty; this.cash += optPrice;
                    this.logMsg(`MOMO SELL ${qty} @ ${optPrice.toFixed(0)}`);
                }
            }
        }

        // MoneyFan Advanced Strategy - Mean Reversion
        class MeanReversion extends Bot {
            constructor(name, color) {
                super(name, color);
                this.maShort = 0;
                this.maLong = 0;
                this.maShortPeriod = 10;
                this.maLongPeriod = 30;
            }
            
            updateMovingAverages() {
                const shortStart = Math.max(0, market.history.length - this.maShortPeriod);
                const longStart = Math.max(0, market.history.length - this.maLongPeriod);
                
                const shortSum = market.history.slice(shortStart).reduce((a, b) => a + b, 0);
                const longSum = market.history.slice(longStart).reduce((a, b) => a + b, 0);
                
                this.maShort = shortSum / (market.history.length - shortStart);
                this.maLong = longSum / (market.history.length - longStart);
            }
            
            think() {
                this.updateMovingAverages();
                
                const price = market.price;
                
                // Buy when price is below short MA and short MA crosses above long MA (mean reversion signal)
                if (price < this.maShort && this.maShort > this.maLong && this.maShort > this.maLong * 1.005 && this.cash > 5000) {
                    const qty = 1;
                    const optPrice = blackScholes(market.price, STRIKE, Math.max(market.T, 1/secondsPerYear), VOLATILITY, RISK_FREE, true);
                    this.options += qty; this.cash -= optPrice;
                    this.logMsg(`MR BUY ${qty} @ ${optPrice.toFixed(0)}`);
                }
                // Sell when price is above short MA and short MA crosses below long MA
                else if (price > this.maShort && this.maShort < this.maLong && this.maShort < this.maLong * 0.995 && this.options > 1) {
                    const qty = 1;
                    const optPrice = blackScholes(market.price, STRIKE, Math.max(market.T, 1/secondsPerYear), VOLATILITY, RISK_FREE, true);
                    this.options -= qty; this.cash += optPrice;
                    this.logMsg(`MR SELL ${qty} @ ${optPrice.toFixed(0)}`);
                }
            }
        }

        // MoneyFan Advanced Strategy - Breakout
        class Breakout extends Bot {
            constructor(name, color) {
                super(name, color);
                this.lookback = 20;
            }
            
            think() {
                if (market.history.length < this.lookback) return;
                
                const recentPrices = market.history.slice(-this.lookback);
                const highest = Math.max(...recentPrices);
                const lowest = Math.min(...recentPrices);
                
                const currentPrice = market.price;
                
                // Buy breakout above resistance
                if (currentPrice > highest * 1.005 && this.cash > 5000) {
                    const qty = 1;
                    const optPrice = blackScholes(market.price, STRIKE, Math.max(market.T, 1/secondsPerYear), VOLATILITY, RISK_FREE, true);
                    this.options += qty; this.cash -= optPrice;
                    this.logMsg(`BREAKOUT BUY ${qty} @ ${optPrice.toFixed(0)}`);
                }
                // Sell breakdown below support
                else if (currentPrice < lowest * 0.995 && this.options > 1) {
                    const qty = 1;
                    const optPrice = blackScholes(market.price, STRIKE, Math.max(market.T, 1/secondsPerYear), VOLATILITY, RISK_FREE, true);
                    this.options -= qty; this.cash += optPrice;
                    this.logMsg(`BREAKDOWN SELL ${qty} @ ${optPrice.toFixed(0)}`);
                }
            }
        }

        /******************************************************************************************
         * 5.  Market & Simulation Loop
         ******************************************************************************************/
        const secondsPerYear = SECONDS_PER_DAY*365.25;
        const bots = [
            new DeltaHedger(\"DeltaHedgeBot\", \"#0af\"),
            new VolArb(\"VolArbBot\", \"#f90\"),
            new Momentum(\"MomBot\", \"#3c3\"),
            new MeanReversion(\"MeanRevBot\", \"#f0f\"),
            new Breakout(\"BreakoutBot\", \"#fa0\")
        ];
        
        const market = {
            price: INITIAL_PRICE,
            history: [INITIAL_PRICE],
            T: DAYS_TO_EXP / 365.25,
            startTime: Date.now(),
            tick: 0,
            volatility: function() {
                if (this.history.length<20) return VOLATILITY;
                const returns = [];
                for (let i=1; i<20; i++) {
                    const idx = this.history.length - 20 + i;
                    const prevIdx = this.history.length - 20 + i - 1;
                    returns.push(Math.log(this.history[idx]/this.history[prevIdx]));
                }
                const mean = returns.reduce((a,b)=>a+b)/returns.length;
                const varr = returns.map(r=>Math.pow(r-mean,2)).reduce((a,b)=>a+b)/(returns.length-1);
                return Math.sqrt(varr * SECONDS_PER_DAY*365.25); // annualized
            }
        };

        function updateMarketInfo() {
            document.getElementById('current-price').textContent = market.price.toFixed(2);
            
            const vol = market.volatility();
            document.getElementById('current-vol').textContent = (vol * 100).toFixed(2) + '%';
            
            const daysLeft = market.T * 365.25;
            document.getElementById('time-exp').textContent = daysLeft.toFixed(2) + ' days';
            
            const totalPnL = bots.reduce((sum, bot) => sum + (bot.value() - bot.initialCash), 0);
            const pnlClass = totalPnL >= 0 ? 'pnl-positive' : 'pnl-negative';
            document.getElementById('total-pnl').innerHTML = '<span class=\"' + pnlClass + '\">' + totalPnL.toFixed(2) + '</span>';
        }

        function step() {
            // 1. evolve price (geometric brownian)
            const dt = 1 / SECONDS_PER_DAY;
            const drift = RISK_FREE - 0.5*VOLATILITY*VOLATILITY;
            const Z = randn();
            market.price *= Math.exp(drift*dt + VOLATILITY*Math.sqrt(dt)*Z);
            market.history.push(market.price);
            if (market.history.length>200) market.history.shift();

            // 2. time decay
            market.T = Math.max(0, (DAYS_TO_EXP*SECONDS_PER_DAY - (Date.now()-market.startTime)/1000) / secondsPerYear);

            // 3. bots act
            bots.forEach(b => b.think());

            // 4. expiry
            if (market.T<=0) {
                bots.forEach(b => {
                    const settle = Math.max(market.price - STRIKE, 0);
                    const payoff = b.options * settle;
                    b.cash += payoff;
                    b.logMsg(`EXPIRY settle ${settle.toFixed(0)} total payoff ${payoff.toFixed(0)}`);
                    b.options = 0;
                    b.shares = 0;
                });
                market.T = DAYS_TO_EXP / 365.25;
                market.startTime = Date.now();
            }

            // 5. render
            updateMarketInfo();
            bots.forEach(b => b.render());
        }

        /******************************************************************************************
         * 6.  UI Wiring
         ******************************************************************************************/
        const arena = document.getElementById('arena');
        bots.forEach(b => {
            const d = document.createElement('div');
            d.className = 'bot';
            d.style.borderColor = b.color;
            arena.appendChild(d);
            b.arenaDiv = d;
            b.render();
        });
        
        let hnd = null;
        document.getElementById('startBtn').onclick = () => {
            if (hnd) { 
                clearInterval(hnd); 
                hnd = null; 
                document.getElementById('startBtn').textContent = 'Start Battle'; 
            } else { 
                hnd = setInterval(step, +document.getElementById('speed').value); 
                document.getElementById('startBtn').textContent = 'Pause'; 
            }
        };
        
        document.getElementById('resetBtn').onclick = () => {
            if (hnd) clearInterval(hnd); 
            hnd = null; 
            document.getElementById('startBtn').textContent = 'Start Battle';
            market.price = INITIAL_PRICE; 
            market.history = [INITIAL_PRICE]; 
            market.tick = 0; 
            market.T = DAYS_TO_EXP / 365.25; 
            market.startTime = Date.now();
            bots.forEach(b => { 
                b.cash = b.initialCash; 
                b.shares = 0; 
                b.options = 0; 
                b.premium = 0; 
                b.log = []; 
                b.render(); 
            });
            updateMarketInfo();
        };
        
        document.getElementById('speed').oninput = () => {
            if (hnd) {
                clearInterval(hnd);
                hnd = setInterval(step, +document.getElementById('speed').value);
            }
        };
        
        document.getElementById('addBotBtn').onclick = () => {
            const botTypes = ['DeltaHedger', 'VolArb', 'Momentum', 'MeanReversion', 'Breakout'];
            const randomType = botTypes[Math.floor(Math.random() * botTypes.length)];
            const randomColors = ['#7cfc00', '#ff69b4', '#40e0d0', '#ff4500', '#9370db'];
            const randomColor = randomColors[Math.floor(Math.random() * randomColors.length)];
            
            let newBot;
            switch(randomType) {
                case 'DeltaHedger':
                    newBot = new DeltaHedger(`Bot-${bots.length + 1}`, randomColor);
                    break;
                case 'VolArb':
                    newBot = new VolArb(`Bot-${bots.length + 1}`, randomColor);
                    break;
                case 'Momentum':
                    newBot = new Momentum(`Bot-${bots.length + 1}`, randomColor);
                    break;
                case 'MeanReversion':
                    newBot = new MeanReversion(`Bot-${bots.length + 1}`, randomColor);
                    break;
                case 'Breakout':
                    newBot = new Breakout(`Bot-${bots.length + 1}`, randomColor);
                    break;
            }
            
            bots.push(newBot);
            
            const d = document.createElement('div');
            d.className = 'bot';
            d.style.borderColor = newBot.color;
            arena.appendChild(d);
            newBot.arenaDiv = d;
            newBot.render();
        };
        
        // Initial market info display
        updateMarketInfo();
    </script>
</body>
</html>
