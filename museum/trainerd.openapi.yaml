openapi: 3.0.3
info:
  title: MoneyFan Trainer Daemon API
  version: 1.0.0
  description: |
    OpenAPI 3 spec for the MoneyFan HTTP daemon (`trainerd.py`) that serves the training console
    and realtime trainer state/control endpoints.

    Notes:
    - `/api/state` and `/api/cache` are polled by the console UI every second.
    - `/api/state.history` contains a mixed stream of throttled in-flight episode telemetry and
      final episode results.
    - `/api/control` updates runtime-safe trainer config fields on the daemon process.
servers:
  - url: http://localhost:8080
    description: Local trainer daemon default
tags:
  - name: Docs
  - name: Training
  - name: Cache
  - name: Drawthru
  - name: Streaming
  - name: Controls
paths:
  /api/openapi.yaml:
    get:
      tags: [Docs]
      summary: Get daemon OpenAPI spec (YAML)
      operationId: getOpenApiYaml
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: Spec file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          description: Spec read failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

