# Trading Configuration for MoneyFan HRM System

# Trading Parameters
trading:
  symbol: "BTC-USD"
  interval: "1H"  # 1H, 4H, 1D
  initial_capital: 10000.0
  risk_per_trade: 0.01  # 1% risk per trade
  mode: "paper"  # paper, live, backtest

# Risk Management
risk:
  max_position_size: 0.1  # 10% max per position
  max_total_exposure: 0.8  # 80% max total exposure
  max_drawdown: -0.2  # -20% max drawdown
  stop_loss_multiplier: 2.0  # 2x ATR for stop loss
  take_profit_multiplier: 3.0  # 3x ATR for take profit
  volatility_adjustment: true
  correlation_penalty: 0.5

# Signal Generation
signals:
  n_models: 5
  confidence_threshold: 0.3
  signal_decay: 0.9
  
  # Regime weights (sum to 1.0)
  regime_weights:
    trend: 0.3
    mean_reversion: 0.3
    volatility: 0.2
    stat_arb: 0.1
    systematic: 0.05
    ml: 0.05

# HRM Configuration
hrm:
  # Data dimensions
  n_assets: 128
  n_features: 15
  n_regimes: 6
  
  # Model dimensions
  hidden_dim: 64
  seq_len: 16  # Short for testing
  n_heads: 4
  
  # HRM structure
  H_cycles: 2  # High-level iterations
  L_cycles: 2  # Low-level iterations
  H_layers: 1  # Transformer blocks in H_level
  L_layers: 1  # Transformer blocks in L_level
  
  # Training
  lr: 1e-4
  weight_decay: 0.1
  batch_size: 4
  epochs: 100

# MLX Configuration
mlx:
  enable_ane: true
  device: "gpu"  # gpu, cpu
  float_precision: "float32"  # float32, float16
  tile_size: 64  # Optimal for cache utilization

# Strategy Parameters
strategy:
  composite_strategy:
    trend_weight: 0.3
    mean_reversion_weight: 0.3
    volatility_weight: 0.4
  
  trend_strategy:
    lookback_period: 20
    ma_slow: 50
    ma_fast: 20
    signal_threshold: 0.1
    position_size: 0.8
  
  mean_reversion_strategy:
    lookback_period: 14
    rsi_oversold: 0.3
    rsi_overbought: 0.7
    bollinger_period: 20
    signal_threshold: 0.1
    position_size: 0.5
  
  volatility_strategy:
    lookback_period: 20
    volatility_threshold: 0.05
    breakout_multiple: 2.0
    signal_threshold: 0.1
    position_size: 0.3

# Backtest Configuration
backtest:
  commission: 0.001  # 0.1% commission
  slippage: 0.001  # 0.1% slippage
  initial_capital: 10000.0

# Data Configuration
data:
  db_path: "core/data/coinbase.duckdb"
  resample_frequency: "1H"
  lookback_period: 100
  feature_normalization: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file_path: "logs/trading.log"
  console_output: true

# Execution Gateway
execution:
  unified_system: "unified_trading_system.js"
  mode: "paper"  # paper, live, backtest
  timeout: 30  # seconds

# Monitoring
monitoring:
  check_interval: 60  # seconds
  alert_on_drawdown: -0.15  # Alert at -15% drawdown
  alert_on_position: 5  # Alert if > 5 positions open
  performance_report_interval: 3600  # seconds (1 hour)

