<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Crypto-Options Multi-Bot Arena</title>\n    <style>\n        body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#eee;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}\n        header{background:#000;padding:.5rem 1rem;font-size:1.2rem;font-weight:bold}\n        #arena{flex:1;display:flex;flex-wrap:wrap;justify-content:space-around;align-items:center;padding:1rem}\n        .bot{width:280px;height:220px;border:2px solid #0af;border-radius:8px;background:#222;display:flex;flex-direction:column;padding:.5rem}\n        .bot h3{margin:0 0 .3rem 0;font-size:1rem;color:#0af}\n        .log{flex:1;background:#000;border-radius:4px;padding:.3rem;font-size:.7rem;overflow-y:auto;white-space:pre-line}\n        #controls{background:#000;padding:.5rem 1rem;display:flex;gap:1rem;align-items:center}\n        button{background:#0af;border:none;color:#000;padding:.4rem .8rem;font-weight:bold;border-radius:4px;cursor:pointer}\n        button:hover{background:#08c}\n        label{font-size:.8rem}\n        input[type=range]{width:120px}\n    </style>\n</head>\n<body>\n<header>Crypto-Options Multi-Bot Arena (Black-Scholes + Dynamic Hedging + Alpha Sniping)</header>\n<div id=\"arena\"></div>\n<div id=\"controls\">\n    <button id=\"startBtn\">Start Battle</button>\n    <button id=\"resetBtn\">Reset</button>\n    <label>Speed <input type=\"range\" id=\"speed\" min=\"100\" max=\"2000\" value=\"500\"></label>\n</div>\n\n<script src=\"/socket.io/socket.io.js\"></script>\n<script>\n// Connect to the Node.js server via WebSocket\nconst socket = io();\n\n// Variables to store market and bot data from the server\nlet marketData = {\n    price: 50000,\n    history: [50000],\n    T: 7 / 365.25,\n    startTime: Date.now(),\n    tick: 0\n};\nlet botsData = [];\n\n// DOM elements\nconst arena = document.getElementById('arena');\nconst startBtn = document.getElementById('startBtn');\nconst resetBtn = document.getElementById('resetBtn');\nconst speedControl = document.getElementById('speed');\n\n// Create bot display elements\nconst botElements = [];\n\n// Initialize the UI with bot containers\nfunction initializeUI() {\n    arena.innerHTML = ''; // Clear existing content\n    \n    // Create bot display containers\n    const botConfigs = [\n        { name: \"DeltaHedgeBot\", color: \"#0af\" },\n        { name: \"VolArbBot\", color: \"#f90\" },\n        { name: \"MomBot\", color: \"#3c3\" }\n    ];\n    \n    botConfigs.forEach(config => {\n        const botDiv = document.createElement('div');\n        botDiv.className = 'bot';\n        botDiv.style.borderColor = config.color;\n        arena.appendChild(botDiv);\n        \n        // Store reference for updates\n        botElements.push({\n            element: botDiv,\n            name: config.name,\n            color: config.color\n        });\n    });\n}\n\n// Update bot display with latest data\nfunction updateBotDisplays() {\n    botElements.forEach((botEl, index) => {\n        if (index < botsData.length) {\n            const bot = botsData[index];\n            botEl.element.innerHTML = `\n<h3 style=\"color:${botEl.color}\">${bot.name}</h3>\n<div class=\"log\">Cash: ${bot.cash.toFixed(0)} USD\nShares: ${bot.shares.toFixed(2)}\nOptions: ${bot.options.toFixed(2)}\nPnL: ${bot.pnl.toFixed(0)}\n${bot.log.map(l => l.message).join('\\n')}</div>`;\n        }\n    });\n}\n\n// Update market info display (if we want to show it somewhere)\nfunction updateMarketDisplay() {\n    // Update can be added here if needed\n}\n\n// Socket event listeners\nsocket.on('marketUpdate', (data) => {\n    marketData = data;\n    updateMarketDisplay();\n});\n\nsocket.on('botsUpdate', (data) => {\n    botsData = data;\n    updateBotDisplays();\n});\n\nsocket.on('statusUpdate', (data) => {\n    if (data.isRunning) {\n        startBtn.textContent = 'Pause';\n    } else {\n        startBtn.textContent = 'Start Battle';\n    }\n    console.log(data.message);\n});\n\n// Button event handlers\nstartBtn.addEventListener('click', () => {\n    if (startBtn.textContent === 'Start Battle') {\n        socket.emit('control:start', { speed: parseInt(speedControl.value) });\n    } else {\n        socket.emit('control:stop');\n    }\n});\n\nresetBtn.addEventListener('click', () => {\n    socket.emit('control:reset');\n});\n\n// Initialize the UI when page loads\ndocument.addEventListener('DOMContentLoaded', () => {\n    initializeUI();\n});\n\n// Update speed control when changed\nspeedControl.addEventListener('change', () => {\n    if (startBtn.textContent === 'Pause') {\n        // If simulation is running, restart with new speed\n        socket.emit('control:stop');\n        setTimeout(() => {\n            socket.emit('control:start', { speed: parseInt(speedControl.value) });\n        }, 100);\n    }\n});\n</script>\n</body>\n</html>
